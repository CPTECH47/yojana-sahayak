name: Daily official source review
on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: official-source-monitor
  cancel-in-progress: false
jobs:
  review:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-ingest.txt
      - uses: actions/cache/restore@v4
        with:
          path: .runtime/source-monitor/state.json
          key: source-monitor-${{ runner.os }}-${{ github.run_id }}
          restore-keys: source-monitor-${{ runner.os }}-
      - run: python -m unittest discover -s scripts -p test_check_sources.py
      - run: python scripts/check_sources.py --summary "$env:GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-source-review
          path: .runtime/source-monitor/report.json
          retention-days: 14
      - uses: actions/cache/save@v4
        if: always() && hashFiles('.runtime/source-monitor/state.json') != ''
        with:
          path: .runtime/source-monitor/state.json
          key: source-monitor-${{ runner.os }}-${{ github.run_id }}
